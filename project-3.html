        #gallery-modal.active { display: flex; }
        .modal-content { width: 100%; height: 100%; max-width: 90vw; max-height: 75vh; display: flex; align-items: center; justify-content: center; }
        .modal-content img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1); }
        .gallery-dock { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.5rem; padding: 0.75rem; display: flex; gap: 0.5rem; z-index: 1001; max-width: 90vw; }
        .dock-item { width: 48px; height: 48px; border-radius: 0.75rem; overflow: hidden; cursor: pointer; transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1); border: 2px solid transparent; opacity: 0.4; flex-shrink: 0; }
        .dock-item img { width: 100%; height: 100%; object-fit: cover; }
        .dock-item.active { border-color: #00f3ff; opacity: 1; transform: translateY(-4px); }
        .artifact-card { position: relative; border-radius: 1rem; overflow: hidden; background: rgba(255,255,255,0.03); cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .artifact-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; filter: grayscale(0.2); }
        .artifact-card:hover img { transform: scale(1.05); filter: grayscale(0); }
        @media (max-width: 768px) { .header-floating { top: 1rem; gap: 1rem; padding: 0.4rem 0.4rem 0.4rem 1rem; } .gallery-dock { padding: 0.5rem; gap: 0.25rem; overflow-x: auto; justify-content: flex-start; } .dock-item { width: 36px; height: 36px; } }

    <div id="gallery-modal">
        <button onclick="closeGallery()" class="absolute top-8 right-8 w-12 h-12 rounded-full bg-white/5 text-white flex items-center justify-center hover:bg-brand_cyan transition-colors z-[1002] backdrop-blur-md border border-white/10">

        </button>
        <div class="modal-content" onclick="closeGallery()"><img id="modal-img" src="" onclick="event.stopPropagation()"></div>
        <div class="gallery-dock" id="dock">
                        <div class="dock-item" onclick="setGalleryImage(0)" data-index="0"><img src="https://framerusercontent.com/images/Oqx6YKytap78HOSr0zKxcs4lU.jpeg"></div>
                        <div class="dock-item" onclick="setGalleryImage(1)" data-index="1"><img src="https://framerusercontent.com/images/Oqx6YKytap78HOSr0zKxcs4lU.jpeg"></div>
                        <div class="dock-item" onclick="setGalleryImage(2)" data-index="2"><img src="https://framerusercontent.com/images/KOBK8KKe96vsUV9PlHUkG6k8.jpeg"></div>
                    </div>
    </div>

    <script>
        const galleryItems = [{"url":"https:\/\/framerusercontent.com\/images\/Oqx6YKytap78HOSr0zKxcs4lU.jpeg","span":"sm:col-span-2 sm:row-span-2"},{"url":"https:\/\/framerusercontent.com\/images\/Oqx6YKytap78HOSr0zKxcs4lU.jpeg","span":"sm:col-span-1 sm:row-span-1"},{"url":"https:\/\/framerusercontent.com\/images\/KOBK8KKe96vsUV9PlHUkG6k8.jpeg","span":"sm:col-span-1 sm:row-span-1"}];
        const modal = document.getElementById('gallery-modal');
        const modalImg = document.getElementById('modal-img');
        const dockItems = document.querySelectorAll('.dock-item');
        function openGallery(index) { modal.classList.add('active'); document.body.style.overflow = 'hidden'; setGalleryImage(index); }
        function closeGallery() { modal.classList.remove('active'); document.body.style.overflow = ''; }
        function setGalleryImage(index) {
            modalImg.src = galleryItems[index].url;
            dockItems.forEach(item => { item.classList.toggle('active', parseInt(item.dataset.index) === index); });
            const activeItem = document.querySelector(`.dock-item[data-index="${index}"]`);
            activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
        const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); }); }, { threshold: 0.05, rootMargin: '50px' });
        document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
        document.addEventListener('keydown', (e) => { if (!modal.classList.contains('active')) return; if (e.key === 'Escape') closeGallery(); });
    </script>
