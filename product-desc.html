    <script>
        const galleryItems = [{"url":"img\/product desc\/1.jpg","span":"sm:col-span-2 sm:row-span-2"},{"url":"img\/product desc\/10.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/11.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/12.jpg","span":"sm:col-span-1 sm:row-span-2"},{"url":"img\/product desc\/1A.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/2.jpg","span":"sm:col-span-2 sm:row-span-2"},{"url":"img\/product desc\/2A.jpg","span":"sm:col-span-1 sm:row-span-2"},{"url":"img\/product desc\/3.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/3A.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/4.jpg","span":"sm:col-span-1 sm:row-span-2"},{"url":"img\/product desc\/4A.jpg","span":"sm:col-span-2 sm:row-span-2"},{"url":"img\/product desc\/5.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/5A.jpg","span":"sm:col-span-1 sm:row-span-2"},{"url":"img\/product desc\/6.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/6A.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/7.jpg","span":"sm:col-span-2 sm:row-span-2"},{"url":"img\/product desc\/7A.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/8.jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/8A.jpg","span":"sm:col-span-1 sm:row-span-2"},{"url":"img\/product desc\/9(1).jpg","span":"sm:col-span-1 sm:row-span-1"},{"url":"img\/product desc\/9.jpg","span":"sm:col-span-2 sm:row-span-2"}];
        const modal = document.getElementById('gallery-modal');
        const modalImg = document.getElementById('modal-img');
        const dockItems = document.querySelectorAll('.dock-item');
        function openGallery(index) { modal.classList.add('active'); document.body.style.overflow = 'hidden'; setGalleryImage(index); }
        function closeGallery() { modal.classList.remove('active'); document.body.style.overflow = ''; }
        function setGalleryImage(index) {
            modalImg.src = galleryItems[index].url;
            dockItems.forEach(item => { item.classList.toggle('active', parseInt(item.dataset.index) === index); });
            const activeItem = document.querySelector(`.dock-item[data-index="${index}"]`);
            activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
        const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); }); }, { threshold: 0.05, rootMargin: '50px' });
        document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
        document.addEventListener('keydown', (e) => { if (!modal.classList.contains('active')) return; if (e.key === 'Escape') closeGallery(); });
    </script>
